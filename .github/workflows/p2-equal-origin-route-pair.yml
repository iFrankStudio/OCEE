name: P2 Equal-Origin A-only vs A+B Full Task
# Fix original P1/P2 switch ambiguity. No speculative Gas retries.
# Original #44994405005 1/2 and #44994931874 invalid-loop 0/2 archived.
on:
  # Native third version 2/2 completed success Run #44995228916.
  # Preserve original red runs #44994405005 and #44994931874.
  # This costly paired experiment must only be replayed explicitly.
  workflow_dispatch:
concurrency:
  group: ocee-p2-equal-origin-route-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  paired-native:
    strategy:
      fail-fast: false
      matrix:
        route: [L, R]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OCEE_P2_PAIR_ROUTE: ${{ matrix.route }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Same paid baseline and identical root, researcher fixed local or remote route
        run: cargo test -p ocee-organism-seeds --test s44_uncertain_outcome p2_equal_origin_researcher_route_full_task_pair -- --ignored --show-output
