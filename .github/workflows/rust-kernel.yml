name: OCEE World Kernel

on:
  push:
    branches: [main]
    paths:
      - "crates/**/*.rs"
      - "crates/**/Cargo.toml"
      - "Cargo.toml"
      - ".github/workflows/rust-kernel.yml"
  pull_request:
    paths:
      - "crates/**/*.rs"
      - "crates/**/Cargo.toml"
      - "Cargo.toml"
      - ".github/workflows/rust-kernel.yml"

# A newer push supersedes earlier same-branch Rust checks.
concurrency:
  group: ocee-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run world and VM invariant tests
        run: cargo test --workspace
      - name: Report S8 lifecycle costs under original A quota
        run: cargo run --quiet -p ocee-organism-seeds --example s8_cost
      - name: Report S14 paired-episode inheritance costs (including import)
        run: cargo test -p ocee-organism-seeds --test s14_transfer -- --nocapture
      - name: Report S15 restricted P2 oracle and transport costs
        run: |
          cargo test -p ocee-calibration-solver --test p2_restricted_calibration -- --nocapture
          cargo test -p ocee-calibration-solver --test p2_restricted_world_oracle -- --nocapture
      - name: Report S17 three-family restricted reference costs
        run: cargo test -p ocee-calibration-solver --test three_family_reference -- --nocapture
      - name: Print auditable development organism manifests
        run: cargo run --quiet -p ocee-organism-seeds --example manifest
