name: OCEE World Kernel

on:
  push:
    branches: [main]
    paths:
      - "crates/**/*.rs"
      - "crates/**/Cargo.toml"
      - "Cargo.toml"
      - ".github/workflows/rust-kernel.yml"
  pull_request:
    paths:
      - "crates/**/*.rs"
      - "crates/**/Cargo.toml"
      - "Cargo.toml"
      - ".github/workflows/rust-kernel.yml"

# A newer push supersedes earlier same-branch Rust checks.
concurrency:
  group: ocee-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run world and VM invariant tests
        run: cargo test --workspace
      - name: Print auditable development organism manifests
        run: cargo run --quiet -p ocee-organism-seeds --example manifest
      - name: One-time S6 development resource pilot (will be moved to on-demand)
        run: cargo run --quiet -p ocee-organism-seeds --example s6_calibration
