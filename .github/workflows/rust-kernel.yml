name: OCEE World Kernel

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**/*.rs"
      - "crates/**/Cargo.toml"
      - "Cargo.toml"
      - ".github/workflows/rust-kernel.yml"

# A newer push supersedes earlier same-branch Rust checks.
concurrency:
  group: ocee-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    # S23's metered multi-episode simulations exceeded the previous 20-minute
    # job ceiling on both original and rerun attempts. Keep a finite ceiling;
    # investigate actual duration before raising it again.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run world and VM invariant tests
        run: cargo test --workspace -- --show-output
      - name: Report S8 lifecycle costs under original A quota
        run: cargo run --quiet -p ocee-organism-seeds --example s8_cost
      # The workspace test already prints captured successful-test evidence
      # via --show-output; rerunning S14/S15/S17/S18 just for logs duplicates
      # costly deterministic-world simulations without additional coverage.
      - name: Print auditable development organism manifests
        run: cargo run --quiet -p ocee-organism-seeds --example manifest
