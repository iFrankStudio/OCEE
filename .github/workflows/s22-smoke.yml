name: S22 P2 Protocol Smoke

on:
  workflow_dispatch:

concurrency:
  group: ocee-s22-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  s22:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate only S22 core causal controls
        run: cargo test -p ocee-organism-seeds --test s22_p2_remote -- --show-output
