name: S22 P2 Protocol Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/s22-smoke.yml"
      - "crates/organism-seeds/src/s22_p2_remote.rs"
      - "crates/organism-seeds/tests/s22_p2_remote.rs"
      - "crates/organism-seeds/src/s21_p2_tlv.rs"
      - "crates/organism-vm/src/lib.rs"
  workflow_dispatch:

concurrency:
  group: ocee-s22-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  s22:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate only S22 core causal controls
        run: cargo test -p ocee-organism-seeds --test s22_p2_remote -- --show-output
