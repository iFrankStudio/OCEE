name: S23 P2 Tool Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/s23-smoke.yml"
      - "crates/organism-seeds/src/s23_p2_tool.rs"
      - "crates/organism-seeds/src/s23_p2_transfer.rs"
      - "crates/organism-seeds/tests/s23_p2_transfer.rs"
      - "crates/organism-seeds/src/s22_p2_remote.rs"
      - "crates/organism-vm/src/lib.rs"
  workflow_dispatch:

concurrency:
  group: ocee-s23-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  s23:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate S23 real P2 tool specialization and transfer controls
        run: cargo test -p ocee-organism-seeds --test s23_p2_transfer -- --show-output
