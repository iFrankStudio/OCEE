name: S24 P2 Seed99 Receive Budget

on:
  workflow_dispatch:

concurrency:
  group: ocee-s24-budget-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate seed99 result and separated counted retries
        run: cargo test -p ocee-organism-seeds --test s24_p2_receive_budget -- --show-output
