name: S24 Recoverable TLV Boundary

on:
  workflow_dispatch:

concurrency:
  group: ocee-s24-recovery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recoverable-p2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify general total TLV preflight
        run: cargo test -p ocee-organism-vm tlv_shape_preflight -- --show-output
      - name: Verify S21 real C reply injection and graceful organism rejection
        run: cargo test -p ocee-organism-seeds --test s21_p2_outer_injection -- --show-output
      - name: Verify ordinary P2 HELLO still succeeds
        run: cargo test -p ocee-organism-seeds --test s21_p2_probe -- --show-output
      - name: Verify real P2 remote C ACK accepts no injected extra TLV
        run: cargo test -p ocee-organism-seeds --test s24_p2_recovery -- --show-output
