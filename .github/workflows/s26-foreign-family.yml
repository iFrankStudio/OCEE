name: S26 Foreign-Family Tool Rejection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/s26-foreign-family.yml"
      - "crates/organism-seeds/tests/s26_foreign_family.rs"
      - "crates/organism-seeds/src/s23_p2_transfer.rs"
  workflow_dispatch:

concurrency:
  group: ocee-s26-foreign-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foreign-family:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify real P1 tool is rejected and P2 active VM relearns within the same budget
        run: cargo test -p ocee-organism-seeds --test s26_foreign_family -- --show-output
