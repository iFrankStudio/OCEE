name: S29 Bounded Receipt Poll Budget
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s29-bounded-receipt-poll.yml'
  workflow_dispatch:
concurrency:
  group: ocee-s29-bounded-receipt-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: SPACE
            test: s29_bounded_receipt_poll_native
          - arm: REORDER
            test: s29_bounded_receipt_poll_native
          - arm: ID_CONFLICT
            test: s29_bounded_receipt_poll_native
          - arm: SPACE
            test: s29_original_receipt_cache_native
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OCEE_S29_RECEIPT_ARM: ${{ matrix.arm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native receipt polling experiment
        run: cargo test -p ocee-organism-seeds --test s29_reclaim_version ${{ matrix.test }} -- --ignored --show-output
