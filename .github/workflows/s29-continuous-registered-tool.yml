name: S29 Continuous Registered Tool Utility
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s29-continuous-registered-tool.yml'
  workflow_dispatch:
concurrency:
  group: ocee-s29-continuous-registered-tool-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  semantic-native:
    strategy:
      fail-fast: false
      matrix:
        seed: [129, 130, 131]
        arm: [RELEASED, PINNED]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OCEE_S29_LIFE_SEED: ${{ matrix.seed }}
      OCEE_S29_CONTINUOUS_ARM: ${{ matrix.arm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native continuous registered-tool computation and storage utility
        run: cargo test -p ocee-organism-seeds --test s29_reclaim_version s29_continuous_registered_tool_native -- --ignored --show-output
