name: S29 Continuous Task History
on:
  # Native 2/2 verified at #45320513669; manual replay only.
  workflow_dispatch:
concurrency:
  group: ocee-s29-continuous-task-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  continuous-native:
    strategy:
      fail-fast: false
      matrix:
        arm: [RELEASED, PINNED]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OCEE_S29_CONTINUOUS_ARM: ${{ matrix.arm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native continuous three-task outcome and retry state
        run: cargo test -p ocee-organism-seeds --test s29_reclaim_version s29_continuous_task_history_native -- --ignored --show-output
