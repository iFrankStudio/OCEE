name: S29 Cost Fit Transfer Limits
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s29-cost-fit-transfer-limits.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ocee-world-kernel s29_cost_fit_transfer_limits_native -- --show-output
