name: S29 Finite Productive Chain
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s29-finite-productive-chain.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ocee-world-kernel finite_escrow -- --show-output
