name: S29 Finite Transform Escrow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s29-finite-transform-escrow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ocee-world-kernel finite_escrow -- --show-output
      - name: Workspace regression after legacy diagnostic exhaustiveness repair
        run: cargo test --workspace
