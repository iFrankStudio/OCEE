name: S29 Matched Lifetime Task Utility Pilot
# Replay after preserving adverse-case failure: only ALL_PINNED may require cooldown A dominance.
on:
  # Verified native #45223821160: both matched pilot tapes passed 2/2.
  # Two earlier red attempts remain archived; keep expensive P2 manual-only.
  workflow_dispatch:
concurrency:
  group: ocee-s29-lifetime-pilot-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  matched-three-policy-pilot:
    strategy:
      fail-fast: false
      matrix:
        tape: [ALL_PINNED, RELEASE_BEFORE_SECOND]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OCEE_S29_LIFE_TAPE: ${{ matrix.tape }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native paired lifetime opportunity and actual paid useful artifact
        run: cargo test -p ocee-organism-seeds --test s29_reclaim_version s29_lifetime_matched_pilot_native -- --ignored --show-output
