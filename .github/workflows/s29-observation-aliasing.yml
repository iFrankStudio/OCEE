name: S29 Observation Aliasing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s29-observation-aliasing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ocee-organism-seeds --test s29_reclaim_version s29_observation_aliasing_native -- --ignored --show-output
