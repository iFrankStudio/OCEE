name: S29 Paid Self-Version Catalog and Bounded VM Discovery
on:
  # Verified native #45180137615: first paid catalog/VM discovery matrix 4/4.
  # Manual rerun only when trusted catalog or index safety changes.
  workflow_dispatch:
concurrency:
  group: ocee-s29-paid-version-catalog-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-catalog-discovery:
    strategy:
      fail-fast: false
      matrix:
        arm: [CATALOG_CONTRACT, DYNAMIC_RECOVERY, PIN_AND_CONTINUATION, INVALIDATED_CERT]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OCEE_S29_CATALOG_ARM: ${{ matrix.arm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Paid catalog, bounded VM dynamic GC discovery and race safety
        run: cargo test -p ocee-organism-seeds --test s29_reclaim_version s29_paid_catalog_discovery_native -- --ignored --show-output
