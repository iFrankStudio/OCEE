name: S29 Exact Public Payload Memo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s29-public-payload-memo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        arm: [SPACE, REORDER, ID_CONFLICT]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OCEE_S29_RECEIPT_ARM: ${{ matrix.arm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ocee-organism-seeds --test s29_reclaim_version s29_public_payload_memo_native -- --ignored --show-output
