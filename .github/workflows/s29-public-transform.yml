name: S29 Public-Label Multi-Operator Transfer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/s29-public-transform.yml"
      - "crates/organism-seeds/src/s29_public_transform.rs"
      - "crates/organism-seeds/tests/s29_public_transform.rs"
      - "crates/organism-seeds/src/lib.rs"
  workflow_dispatch:

concurrency:
  group: ocee-s29-public-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evidence-selected-transform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Frozen root learns three operators from public examples and reuses P1 executables in P2
        run: cargo test -p ocee-organism-seeds --test s29_public_transform -- --show-output
