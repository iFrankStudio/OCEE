name: S29 Paid Own-Resource Maintenance Decision
# Native #45126843831 failed Rust E0502 at test audit/Exec borrow; this is
# a one-shot rerun with only the borrow lifetime corrected.
on:
  # Scoped 4/4 native #45127009918 completed/success. Manual replays only.
  workflow_dispatch:
concurrency:
  group: ocee-s29-resource-policy-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-policy:
    strategy:
      fail-fast: false
      matrix:
        arm: [PRESSURE, RELAXED, LOW_GAS, INVALIDATED]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OCEE_S29_POLICY_ARM: ${{ matrix.arm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native metered resource feedback conditional maintenance
        run: cargo test -p ocee-organism-seeds --test s29_reclaim_version s29_resource_policy_native -- --ignored --show-output
