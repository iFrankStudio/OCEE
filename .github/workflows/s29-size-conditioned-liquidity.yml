name: S29 Size Conditioned Liquidity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s29-size-conditioned-liquidity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ocee-world-kernel s29_size_conditioned_liquidity_native -- --show-output
