name: S29 Two Sample Cost Fit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s29-two-sample-cost-fit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ocee-world-kernel s29_two_sample_cost_fit_native -- --show-output
