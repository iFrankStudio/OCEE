name: S29 Metered Conservative Program Version Reclaim
# #45121234194 compile syntax fail; #45121401232 passed 2/4,
# long arms rejected fixture's stale active CAS0. Rerun using paid actual version.
on:
  # Native four-arm Run #45121695557 completed/success; replay manually.
  workflow_dispatch:
concurrency:
  group: ocee-s29-version-reclaim-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-reclaim:
    strategy:
      fail-fast: false
      matrix:
        arm: [POST_REPAIR, REGISTERED, ROOTS, OPAQUE_REF]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OCEE_S29_GC_ARM: ${{ matrix.arm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native metered reference-safe program collection
        run: cargo test -p ocee-organism-seeds --test s29_reclaim_version s29_reclaim_version_native -- --ignored --show-output
