name: S38 Task-Revision-Licensed One-Shot Probe Recovery

on:
  workflow_dispatch:

concurrency:
  group: ocee-s38-task-recovery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-licensed-relearning:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: "Native task revision - paid new probe, evidence CAS, changed tool, real B, one-shot budget"
        run: cargo test -p ocee-organism-seeds --test s38_task_recovery -- --show-output
