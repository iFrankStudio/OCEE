name: S39 Real Remote Task Fence at Send and Service Consumption

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/s39-task-fence.yml"
      - "crates/organism-seeds/src/s39_task_fenced_remote.rs"
      - "crates/organism-seeds/tests/s39_task_fence.rs"
      - "crates/organism-seeds/src/lib.rs"
      - "crates/organism-seeds/tests/s28_cross_utility.rs"
      - "crates/world-kernel/src/lib.rs"
      - "crates/world-kernel/src/program_host.rs"
      - "crates/organism-vm/src/lib.rs"
  workflow_dispatch:

concurrency:
  group: ocee-s39-task-fence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-real-remote-fence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native task-fence protected remote execution and two TOCTOU counterfactuals
        run: cargo test -p ocee-organism-seeds --test s39_task_fence -- --show-output
