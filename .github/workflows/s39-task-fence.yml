name: S39 Real Remote Task Fence at Send and Service Consumption

on:
  workflow_dispatch:

concurrency:
  group: ocee-s39-task-fence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-real-remote-fence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native task-fence protected remote execution and two TOCTOU counterfactuals
        run: cargo test -p ocee-organism-seeds --test s39_task_fence -- --show-output
