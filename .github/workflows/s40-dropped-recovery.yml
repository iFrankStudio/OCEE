name: S40 Dropped Task Retry Via Autonomous VM Root Relearning

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/s40-dropped-recovery.yml"
      - "crates/organism-seeds/src/s40_dropped_recovery.rs"
      - "crates/organism-seeds/tests/s40_dropped_recovery.rs"
      - "crates/organism-seeds/src/lib.rs"
      - "crates/organism-seeds/tests/s28_cross_utility.rs"
      - "crates/world-kernel/src/lib.rs"
      - "crates/world-kernel/src/program_host.rs"
      - "crates/organism-vm/src/lib.rs"
  workflow_dispatch:

concurrency:
  group: ocee-s40-dropped-recovery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-dropped-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native bounded in-flight drop recovery and end-to-end real B idempotency
        run: cargo test -p ocee-organism-seeds --test s40_dropped_recovery -- --show-output
