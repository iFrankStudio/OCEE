name: S41 Paid Early Drop Detection and Namespace-Lifetime Replay

on:
  # S41 existing suite passed in full on public runner: Run #44862672828.
  # Do not replay 8 historical simulations for every new shared module.
  workflow_dispatch:

concurrency:
  group: ocee-s41-early-drop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-early-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: "Native S41 early vs S40 timeout, real B once and prefix-lifetime evidence"
        run: cargo test -p ocee-organism-seeds --test s41_early_drop -- --show-output
