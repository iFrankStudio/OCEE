name: S42A Latest Guarded Request Drop Causality
on:
  # One-shot native verification after repository became public.
  # Only edits to this specific workflow start the focused study.
  push:
    branches: [main]
    paths:
      - ".github/workflows/s42a-request-fence.yml"
  workflow_dispatch:

concurrency:
  group: ocee-s42a-request-fence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-request-causality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native S42A stale drop versus newer inflight request
        run: cargo test -p ocee-world-kernel s42_stale_drop_cannot_authorize_recovery_for_newer_inflight_request -- --show-output
      - name: Native S42A missing-task authorization negative control
        run: cargo test -p ocee-world-kernel s42_missing_public_task_never_authorizes_restart -- --show-output
