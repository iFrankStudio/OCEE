      - name: Six-step latency plus genuine task drift recovers once with B once
        run: cargo test -p ocee-organism-seeds --test s44_uncertain_outcome s45_global_six_step_delay_and_real_task_drop_relearns_exactly_once -- --show-output
      - name: Forged phase2 RESULT under delayed network cannot be confirmed
        run: cargo test -p ocee-organism-seeds --test s44_uncertain_outcome s45_delayed_phase2_forged_reply_fails_closed_after_real_b -- --show-output
